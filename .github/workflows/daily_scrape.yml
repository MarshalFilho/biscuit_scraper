name: 🚀 Scraper Diário Automatizado & IA Analytics

on:
  schedule:
    # Executa todo dia às 09:00 UTC (06:00 horário de Brasília)
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      plataforma:
        description: 'Plataforma para raspar (todos / meli / shopee)'
        required: false
        default: 'todos'
        type: choice
        options:
          - todos
          - meli
          - shopee

jobs:
  run-daily-scrape:
    name: 🤖 Executar Scraping & Relatórios de IA
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Instalar Dependências & Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 🔑 Restaurar Cookies de Sessão (Opcional Bypass)
        env:
          AUTH_MELI_JSON: ${{ secrets.AUTH_MELI_JSON }}
          AUTH_SHOPEE_JSON: ${{ secrets.AUTH_SHOPEE_JSON }}
        run: |
          mkdir -p data/auth
          if [ -n "$AUTH_MELI_JSON" ]; then
            echo "$AUTH_MELI_JSON" > data/auth/auth_meli.json
            echo "$AUTH_MELI_JSON" > data/auth/auth.json
            echo "✅ Cookies do Mercado Livre restaurados."
          fi
          if [ -n "$AUTH_SHOPEE_JSON" ]; then
            echo "$AUTH_SHOPEE_JSON" > data/auth/auth_shopee.json
            echo "✅ Cookies da Shopee restaurados."
          fi

      - name: ⚡ Executar Pipeline Diário de Coleta & IA Multi-Tenant
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          PLAT="${{ github.event.inputs.plataforma || 'todos' }}"
          echo "🚀 Disparando rotina diária no GitHub Actions (Plataforma: $PLAT)..."
          python src/main.py --daily-cron --plataforma "$PLAT"

      - name: 📤 Salvar Artefatos & Diagnósticos (Logs e Screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-daily-debug
          path: |
            data/
            reports/
          retention-days: 7
