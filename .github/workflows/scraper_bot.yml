name: 🚀 Bot de Extração - Scraper Nuvem Autônomo

on:
  workflow_dispatch: # Permite disparo manual na aba Actions do GitHub
  schedule:
    - cron: '*/5 * * * *' # Executa a verificação a cada 5 minutos

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Instalar Dependências e Navegador Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 🔑 Restaurar Cookies de Sessão (Bypass WAF)
        env:
          AUTH_MELI_JSON: ${{ secrets.AUTH_MELI_JSON }}
          AUTH_SHOPEE_JSON: ${{ secrets.AUTH_SHOPEE_JSON }}
        run: |
          mkdir -p data/auth
          if [ -n "$AUTH_MELI_JSON" ]; then
            echo "$AUTH_MELI_JSON" > data/auth/auth_meli.json
            echo "$AUTH_MELI_JSON" > data/auth/auth.json
            echo "✅ Cookies do Mercado Livre restaurados com sucesso."
          fi
          if [ -n "$AUTH_SHOPEE_JSON" ]; then
            echo "$AUTH_SHOPEE_JSON" > data/auth/auth_shopee.json
            echo "✅ Cookies da Shopee restaurados com sucesso."
          fi

      - name: 🤖 Checar Supabase e Rodar Scraper (Se Pendente)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
        run: |
          python src/main.py --plataforma todos --cloud

      - name: 📤 Salvar Artefato HTML para Diagnóstico Auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-debug-files
          path: data/
