name: 🚀 Bot de Extração - Scraper Nuvem

on:
  repository_dispatch:
    types: [disparo_supabase] # Permite disparo via Webhook do Supabase / Dashboard
  workflow_dispatch: # Permite disparo manual na aba Actions do GitHub
  schedule:
    - cron: '0 3 * * 1' # Executa semanalmente toda segunda-feira às 03:00 UTC (00:00 BRT)

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Instalar Dependências e Navegador Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 🤖 Rodar o Scraper (Modo Nuvem One-Shot)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
        run: |
          python src/main.py --plataforma todos --cloud
